<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studocu Cleaner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <h1>Studocu Cleaner</h1>
    </div>
    <span class="version">v1.0</span>
  </header>

  <main>
    <div class="card">
      <button id="clearBtn" class="btn btn-secondary">
        <div class="icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
        </div>
        <div class="btn-text">
          <span class="btn-title">1. Gỡ mờ và watermark</span>
          <span class="btn-desc">Xoá cookie Studocu (sẽ đăng xuất) rồi tải lại trang</span>
        </div>
      </button>

      <button id="checkBtn" class="btn btn-primary">
        <div class="icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </div>
        <div class="btn-text">
          <span class="btn-title">2. Tạo file PDF</span>
          <span class="btn-desc">Cuộn hết tài liệu trước, rồi lưu thành PDF</span>
        </div>
      </button>
    </div>

    <div id="status" class="status-bar">
      <span class="status-dot"></span>
      <span id="status-text">Làm theo bước 1 → 2 để bắt đầu</span>
    </div>

    <footer>
      Built with <span class="heart">❤</span> by <span class="author">Anthalia</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
